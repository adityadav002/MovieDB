<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>MovieDB - Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-bright": "#3a393a",

                        "primary-container": "#e50914",

                        "surface-container-lowest": "#0e0e0f",

<style>
        /* Custom scrollbar for dark cinematic theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0A0A0B; }
        ::-webkit-scrollbar-thumb { background: #2a2a2b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #474649; }
        
        .glass-panel {
            background-color: rgba(10, 10, 11, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .cinematic-input {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .cinematic-input:focus {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: #E50914; /* Brand Red */
            box-shadow: 0 0 0 1px #E50914;
            outline: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Atmospheric Background (Placeholder Image with Gradient Overlay) -->
<div class="fixed inset-0 z-[-1]">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A sweeping, dramatic cinematic landscape from a classic science fiction film, rendered in deep obsidian blacks and glowing crimson reds. The scene features massive, brutalist architecture silhouetted against a starlit, moody sky. Volumetric lighting streaks through atmospheric haze, creating a sense of epic scale and mystery. The overall aesthetic is dark, premium, and highly detailed, perfect for a high-end streaming service backdrop." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCJjvP4s6Rb7HqzWYpKpra7tOo4b_lstog4FwiJefsABBRzPe2P036vrGEJ-akKF5ggEyxZsr0Qrwo7mhjLx5zkGMBU4zQx6ji1nuLFgZ9WgocNIz1B86YC2yhVotaH0sjuBDJxmzwck7l3gybgtAWtDcHXk9eVLMdTaj4SV9LBNpI4E09rG_B9hyWYd6i0DmZ0N3nYXGw3pmv9nd53EOqud6KrBjAWx0jP25iPSzRv-VYSMjP7iSf2')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/80 to-surface-container-lowest/40"></div>
<div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
</div>
<!-- TopNavBar (Simplified for Transactional Intent) -->
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest/60 backdrop-blur-24px">
<div class="flex justify-between items-center w-full px-gutter-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto">
<a class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg tracking-tighter text-primary" href="#">MovieDB</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-300" href="#">Login</a>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-[100px] pb-stack-lg px-gutter-mobile md:px-gutter-desktop relative z-10">
<!-- Sign Up Card -->
<div class="glass-panel w-full max-w-md rounded-xl p-margin-mobile md:p-stack-lg shadow-2xl relative overflow-hidden group transition-transform duration-500 hover:scale-[1.01]">
<!-- Inner Glow Effect -->
<div class="absolute inset-0 border border-white/5 rounded-xl group-hover:border-white/15 transition-colors duration-500 pointer-events-none"></div>
<div class="text-center mb-stack-lg relative z-10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the cinematic universe.</p>
</div>
<form action="#" class="space-y-stack-md relative z-10">
<!-- Full Name -->
<div>
<label class="sr-only" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-opacity-70">person</span>
</div>
<input class="cinematic-input block w-full pl-10 pr-3 py-3 rounded-lg text-on-surface placeholder-on-surface-variant font-body-md focus:ring-0" id="fullName" name="fullName" placeholder="Full Name" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="sr-only" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-opacity-70">mail</span>
</div>
<input class="cinematic-input block w-full pl-10 pr-3 py-3 rounded-lg text-on-surface placeholder-on-surface-variant font-body-md focus:ring-0" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="sr-only" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-opacity-70">lock</span>
</div>
<input class="cinematic-input block w-full pl-10 pr-3 py-3 rounded-lg text-on-surface placeholder-on-surface-variant font-body-md focus:ring-0" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="sr-only" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-opacity-70">lock_reset</span>
</div>
<input class="cinematic-input block w-full pl-10 pr-3 py-3 rounded-lg text-on-surface placeholder-on-surface-variant font-body-md focus:ring-0" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#E50914] text-white font-metadata text-metadata py-3 rounded-lg bg-gradient-to-r from-[#E50914] to-[#B30710] hover:brightness-110 transition-all duration-300 shadow-lg flex justify-center items-center gap-2 mt-stack-md" type="submit">
<span>Sign Up</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-stack-md relative z-10">
<div class="flex-grow border-t border-white/10"></div>
<span class="px-4 text-on-surface-variant font-label-caps text-label-caps">OR</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- Social Logins -->
<div class="space-y-3 relative z-10">
<button class="w-full flex items-center justify-center gap-3 py-2.5 rounded-lg border border-white/20 bg-white/5 hover:bg-white/10 transition-colors duration-300 text-on-surface font-body-md text-sm">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<button class="w-full flex items-center justify-center gap-3 py-2.5 rounded-lg border border-white/20 bg-white/5 hover:bg-white/10 transition-colors duration-300 text-on-surface font-body-md text-sm">
<svg class="w-5 h-5 text-white" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.4 7.6c.8-1 1.4-2.3 1.2-3.6-1.1.1-2.5.8-3.4 1.7-.7.7-1.4 2-1.2 3.4 1.2.1 2.5-.5 3.4-1.5zm-3.5 12.6c-1.4 0-2.8-.9-3.6-.9-.8 0-2 .8-3.3.8-1.7 0-3.3-1-4.2-2.5-1.8-3.1-1.2-7.8.6-10.4 1-1.5 2.5-2.4 4.2-2.4 1.3 0 2.5.9 3.3.9.8 0 2.2-1 3.7-1 1.9 0 3.6 1 4.5 2.6-4.1 2.5-3.4 8.5.7 10.1-.9 1.4-2 3-3.3 3h-2.6z"></path>
</svg>
                    Continue with Apple
                </button>
</div>
<!-- Login Toggle -->
<p class="text-center mt-stack-md text-on-surface-variant font-body-md text-sm relative z-10">
                Already have an account? 
                <a class="text-primary hover:text-white font-medium transition-colors duration-300" href="#">Login</a>
</p>
</div>
</main>
<!-- Footer -->
<footer class="w-full bg-surface-container-lowest border-t border-white/5 relative z-10">
<div class="w-full px-margin-desktop py-stack-lg max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-stack-md">
<a class="font-display-lg text-display-lg text-primary" href="#">MovieDB</a>
<div class="flex flex-wrap justify-center gap-4 text-secondary font-normal font-label-caps text-label-caps">
<a class="hover:text-primary transition-colors duration-200" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors duration-200" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors duration-200" href="#">Help Center</a>
<a class="hover:text-primary transition-colors duration-200" href="#">Contact Us</a>
<a class="hover:text-primary transition-colors duration-200" href="#">Careers</a>
</div>
<div class="text-on-surface-variant font-metadata text-metadata text-center md:text-right">
                © 2024 MovieDB. All rights reserved. Designed for the cinematic soul.
            </div>
</div>
</footer>
</body></html>
