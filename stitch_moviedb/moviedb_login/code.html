<div class="flex justify-between items-center w-full px-margin-desktop py-4 max-w-container-max mx-auto">
<div class="font-display-lg text-display-lg tracking-tighter text-primary">MovieDB</div>
<!-- Navigation suppressed for transactional intent -->
</div>
</header>
<!-- Main Content Canvas -->

<!-- Background Image with Noir/Cinematic Vibe -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A moody, high-contrast cinematic shot of an empty movie theater aisle illuminated by subtle floor lights and a deep, glowing red neon sign in the distance. The scene uses chiaroscuro lighting, deep shadows, and a dark obsidian palette with striking crimson accents, creating an atmosphere of intense anticipation and mystery, highly styled and premium." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBo1sboUzQnPMPfQF-IzGl1rz7JUwpj5ZP1Pvn9MeANxdAghRvVd9iQoq6JDLSiq4nsUO4MAP1JCx7AkVtmrLGPxUu6G5vhTg1FQB7zRmxfuMEhEAIPVQu22z1G5JWMdcl58mH3ZErrM64cERfdLTGinRbOBxSJzeYQgeNNNeXyZIuSpzFdFS4_vslW4EPoIuTE5PZ2o9TDHaLRlmMmwgmp2wssxABKMViopqYPMHrbu4q8nWa83NHl')"></div>

<div class="absolute inset-0 bg-surface-container-lowest/70 backdrop-blur-[2px]"></div>
</div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-md glass-panel rounded-xl p-stack-lg shadow-2xl transition-transform duration-500 hover:scale-[1.02] hover:border-white/10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm text-center">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-stack-lg">Log in to resume your cinematic journey.</p>
<form class="space-y-stack-md flex flex-col">
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full bg-surface-container/50 border border-white/10 rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-body-md text-body-md" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2 ml-1">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="lock">lock</span>
<input class="w-full bg-surface-container/50 border border-white/10 rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-body-md text-body-md" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-label-caps text-label-caps py-4 rounded-lg mt-stack-md hover:bg-inverse-primary transition-colors duration-300 shadow-[0_0_15px_rgba(229,9,20,0.3)] hover:shadow-[0_0_25px_rgba(229,9,20,0.5)] flex justify-center items-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
<div class="mt-stack-lg text-center border-t border-white/5 pt-stack-md">
<p class="font-body-md text-body-md text-on-surface-variant">
